<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="script.js"></script>
    <script>
        //để viết chú thích js dùng kí tự//
        document.writeln("hello world" + "<br>") // xuống dòng trong js dùng br như trên

        let hoTen = "Vu Trung Duc";
        document.writeln(hoTen + "<br>"); // phương pháp nối chuỗi + 
        
        //Hằng
        const pi = 3.14;

        let soThuNhat = 10;
        let soThuHai = 5;
        let ketQua = 0;
        //+
        ketQua = soThuNhat + soThuHai;
        document.writeln(ketQua);

        //-
        ketQua = soThuNhat - soThuHai;
        document.writeln("<br>" + ketQua);

        // / 
        ketQua = soThuNhat / soThuHai;
        document.writeln("<br>" + ketQua);

        // *
        ketQua = soThuNhat * soThuHai;
        document.writeln("<br>" + ketQua);

        // phép gán
        soThuNhat += soThuHai;
        document.writeln( "<br>" + soThuNhat);

        let thongTinSinhVien = {
            hoTen: "Vũ Trung Đức" ,
            tuoi: 20 ,
            gioiTinh: true,
            lop: "Mạng máy tính K68" ,
        };

        let diaChicuaban = {
            thanhPho =  "Bắc Ninh" ,
            quanHuyen = "Bắc Ninh" ,
            xaPhuong = "Võ Cường" ,
        };

        thongTinSinhVien.diaChi = diaChicuaban ;
        document.writeln( 
            " <br> " + "Xin chào" 
        + thongTinSinhVien.hoTen 
        + "Lớp" + thongTinSinhVien.lop 
        + "nhà ở" + thongTinSinhVien.diaChi.xaPhuong
        + " Thành phố " + thongTinSinhVien.diaChi.thanhPho 
        );

        let soThuHai = "10"

        soThuHai = parseInt(soThuHai);
        
        document.writeln(typeof soThuHai);

    </script>
